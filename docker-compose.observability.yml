# ModelRail — optional observability stack (spec §14).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     --profile observability up -d
name: modelrail

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Local development only — override in any shared environment.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.0
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/tmp/tempo
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/collector.yml"]
    ports:
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./infra/otel/collector.yml:/etc/otelcol/collector.yml:ro
    depends_on:
      - tempo
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  tempo_data:
