name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter
        run: ruff check .

      - name: Run ruff formatter check
        run: ruff format --check .

      - name: Run mypy type checker
        run: mypy apps/gateway packages/evals

  test-and-coverage:
    name: Tests & Coverage (PostgreSQL 16 + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modelrail
          POSTGRES_PASSWORD: modelrail-local-only
          POSTGRES_DB: modelrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://modelrail:modelrail-local-only@localhost:5432/modelrail
        run: alembic upgrade head

      - name: Run pytest test suite with coverage gate (>= 80%)
        env:
          DATABASE_URL: postgresql+psycopg://modelrail:modelrail-local-only@localhost:5432/modelrail
          REDIS_URL: redis://localhost:6379/0
          ADMIN_TOKEN: test-admin-token
          API_KEY_PEPPER: test-pepper
        run: |
          pytest --cov=apps/gateway/app --cov=packages/evals/modelrail_evals --cov-fail-under=80 -v

      - name: Verify LLM Evaluation regression gate
        run: |
          mkdir -p /tmp/evals
          python -m modelrail_evals.runner --dataset packages/evals/datasets/modelrail-eval-v1.jsonl --mode good --out /tmp/evals/baseline.json
          python -m modelrail_evals.gate --baseline /tmp/evals/baseline.json --candidate /tmp/evals/baseline.json
          python -m modelrail_evals.runner --dataset packages/evals/datasets/modelrail-eval-v1.jsonl --mode degraded --out /tmp/evals/candidate.json
          if python -m modelrail_evals.gate --baseline /tmp/evals/baseline.json --candidate /tmp/evals/candidate.json; then
            echo "Regression gate should have failed degraded candidate but passed"
            exit 1
          else
            echo "Regression gate successfully caught degraded candidate"
          fi

  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
