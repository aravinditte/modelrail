# ModelRail — local-first deployment (spec §3, §20).
# Default ("minimal") stack: gateway + worker + postgres + redis.
# Dashboard is opt-in:  docker compose --profile dashboard up
# Observability is a separate file + profile:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml \
#     --profile observability up
name: modelrail

services:
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://modelrail:modelrail-local-only@postgres:5432/modelrail}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MODELRAIL_API_KEY_PEPPER: ${MODELRAIL_API_KEY_PEPPER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      REMOTE_PROVIDER_BASE_URL: ${REMOTE_PROVIDER_BASE_URL:-}
      REMOTE_PROVIDER_API_KEY: ${REMOTE_PROVIDER_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  worker:
    # Evaluation worker (spec §3.1): separate process, same persistent store.
    build:
      context: .
      dockerfile: apps/evaluation-worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://modelrail:modelrail-local-only@postgres:5432/modelrail}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MODELRAIL_API_KEY_PEPPER: ${MODELRAIL_API_KEY_PEPPER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    profiles: ["dashboard"]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-modelrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modelrail-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-modelrail}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modelrail} -d ${POSTGRES_DB:-modelrail}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped


  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  test-runner:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    profiles: ["test"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://modelrail:modelrail-local-only@postgres:5432/modelrail}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-pepper}
    command: ["pytest", "tests", "-v"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ollama_data:
