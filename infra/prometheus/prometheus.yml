# Prometheus scrape configuration for ModelRail (spec §14.1).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: modelrail-gateway
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: gateway

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-collector

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
