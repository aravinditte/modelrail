# ModelRail — Test execution compose configuration (spec §5, §20)
# Usage:
#   docker compose -f docker-compose.yml -f infra/compose/docker-compose.test.yml --profile test up --abort-on-container-exit
services:
  test-runner:
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    profiles: ["test"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://modelrail:modelrail-local-only@postgres:5432/modelrail}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-pepper}
    command: ["pytest", "tests", "-v"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
